data:
  validation_report: "validation_report.json"
  feature_manifest: "feature_manifest.json"
  features: "features.parquet"
  window_index: "window_index.parquet"
  groups: ["shape", "relation", "motion"]
  nominal_fps: 16.0
  reaction_margin_seconds: 0.5
  expected_window_size: 16
  allowed_labels: [0, 1, 2, 3, 4, 5, 6]

model:
  hidden_size: 128
  num_layers: 2
  dropout: 0.4
  bidirectional: false
  pooling: "attention"
  layer_norm: true
  num_classes: 7

training:
  device: "cuda"
  seed: 42
  batch_size: 128
  epochs: 50
  learning_rate: 0.0003
  weight_decay: 0.001
  label_smoothing: 0.05
  early_stopping_patience: 10
  scheduler_patience: 2
  scheduler_factor: 0.5
  gradient_clip_norm: 1.0
  num_workers: 2
  mixed_precision: true
  class_weighted_loss: true

metrics:
  primary: "macro_f1"
