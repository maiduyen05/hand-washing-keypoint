source:
  record_url: "https://zenodo.org/records/5808789"
  doi: "10.5281/zenodo.5808789"
  statistics_url: "https://zenodo.org/api/records/5808789/files/statistics.csv/content"
  # statistics_md5: "e5c66f07be277a5a79bbf11933470968"
  statistics_md5: "c6072004ac085e49083404651210a7a0"
  # cái trên là của down trên web về, cái dưới là của local :))
  # MD5 (Message Digest Algorithm 5) là một thuật toán tạo ra một chuỗi ký tự dài 32 ký tự hexadecimal, 
  # giống như dấu vân tay của file.
  # MD5 giúp kiểm tra tính nhất quán của file, chứ không đánh giá dữ liệu bên trong có chính xác hay không. 
  # MD5 cũng không còn phù hợp để kiểm chứng bảo mật vì có thể xảy ra va chạm mã băm.
  expected_videos: 211
  expected_participants: 72

paths:
  train_csv: "data/train_hand_keypoints.csv"
  test_csv: "data/test_hand_keypoints.csv"
  output_dir: "artifacts/preprocessing_16"

split:
  seed: 42
  train_participants: 50
  validation_participants: 11
  test_participants: 11
  folds: 5
  search_iterations: 5000

temporal:
  nominal_fps: 16.0
  reaction_margin_seconds: 0.5
  interpolation_max_seconds: 0.25

features:
  shape: true
  relation: true
  motion: true

sequence:
  window_size: 16
  stride: 8

processing:
  csv_chunk_size: 5000
  parquet_compression: "zstd"

validation:
  allowed_labels: [0, 1, 2, 3, 4, 5, 6]
  require_unique_feature_names: true
  require_participant_disjoint: true
